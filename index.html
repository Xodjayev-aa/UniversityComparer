<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>UniScope — university discovery and comparison</title>
    <meta
      name="description"
      content="Find universities worldwide and compare sourced facts. Free, no account. Missing information is labelled, never invented."

    <meta name="theme-color" content="#0e2a2a" />

    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />

  <body>
    <noscript>
      <div style="font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 1rem">

          Search and comparison run in your browser. Without JavaScript you can still read

          live data it cannot load.
        </p>
      </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
