name: Scheduled directory ingest

on:
  schedule:
    # Monthly, on the 5th at 04:15 UTC. ROR releases approximately quarterly;
    # monthly checks pick up releases without hammering the sources.
    - cron: '15 4 5 * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Ignore the download cache and fetch the sources again'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Restore the source cache
        uses: actions/cache@v4
        with:
          path: data/build/.cache
          key: ingest-cache-${{ github.run_id }}
          restore-keys: |
            ingest-cache-
      - name: Build the dataset
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          if [ "${{ inputs.refresh }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            npm run ingest -- --refresh
          else
            npm run ingest
          fi
      - name: Validate the result
        run: npm run validate:data
      - name: Commit changed artifacts
        run: |
          git config user.name "uniscope-bot"
          git config user.email "uniscope-bot@users.noreply.github.com"
          git add data/build/institutions.json.gz data/build/coverage.json data/build/history.json docs/COVERAGE.md
          if git diff --cached --quiet; then
            echo "No dataset changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): scheduled directory ingest $(date -u +%Y-%m-%d)"
          git push
      - name: Summary
        run: |
          echo "### Dataset" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm run validate:data >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
